controller_node:
  ros__parameters:
    use_sim_time: false
    colision_checker:
      active: true
      debug_markers: false
      downsample_leaf_size: 0.05
      robot_radius: 0.2
      brake_acc: 1.0
      safety_margin: 0.05
    controller_types: [rpp]
    rpp:
      rt_freq: 20.0
      plugin: easynav_regulated_pp_controller/RegulatedPurePursuitController
      # Velocity / acceleration limits (TurtleBot 2 / Kobuki base)
      max_linear_vel: 0.35
      min_linear_vel: -0.02
      max_angular_vel: 1.2
      min_angular_vel: -1.2
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 2.0
      max_angular_decel: 2.0
      use_dynamic_window: false
      allow_reversing: false
      # Lookahead
      lookahead_dist: 0.7
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.2
      rotate_to_heading_min_angle: 1.5
      max_robot_pose_search_dist: 10.0


localizer_node:
  ros__parameters:
    use_sim_time: false
    localizer_types: [costmap]

    costmap:
      rt_freq: 50.0
      freq: 5.0
      reseed_freq: 1.0
      plugin: easynav_costmap_localizer/AMCLLocalizer
      num_particles: 100
      noise_translation: 0.05
      noise_rotation: 0.1
      noise_translation_to_rotation: 0.1
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0
        std_dev_xy: 0.1
        std_dev_yaw: 0.01

maps_manager_node:
  ros__parameters:
    use_sim_time: false
    map_types: [costmap]
    costmap:
      freq: 10.0
      plugin: easynav_costmap_maps_manager/CostmapMapsManager
      package: easynav_experiments
      map_path_file: maps/my-home.yaml
      filters: [obstacles, inflation]
      obstacles:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/ObstaclesFilter
      inflation:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/InflationFilter
        inflation_radius: 6.0
        inscribed_radius: 0.2
        cost_scaling_factor: 6.0

planner_node:
  ros__parameters:
    use_sim_time: false
    planner_types: [costmap]
    costmap:
      freq: 0.5
      plugin: easynav_costmap_planner/CostmapPlanner
      cost_factor: 10.0
      continuous_replan: false

sensors_node:
  ros__parameters:
    use_sim_time: false
    forget_time: 0.5
    sensors: [laser1]
    laser1:
      topic: scan
      type: sensor_msgs/msg/LaserScan

system_node:
  ros__parameters:
    use_sim_time: false
    use_real_time: true
    position_tolerance: 0.25
    angle_tolerance: 0.25
    use_cmd_vel_stamped: true
    freq: 30.0
    rt_freq: 50.0
    allow_preempt_goal: true
